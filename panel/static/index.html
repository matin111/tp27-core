<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TP27 Control</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo">TP27 <b>Control</b></div>
    <div class="actions">
      <button class="btn" onclick="loadStatus()">بروزرسانی</button>
      <a class="btn link" href="/logout">خروج</a>
    </div>
  </header>

  <section class="stats">
    <article class="card"><span class="muted">IP ایران</span><strong id="publicIp">-</strong></article>
    <article class="card"><span class="muted">خروجی‌ها</span><strong id="exitCount">0</strong></article>
    <article class="card"><span class="muted">آنلاین</span><strong id="onlineCount">0</strong></article>
  </section>

  <main class="main">
    <section class="card">
      <div class="section-title"><h3>تونل‌ها</h3></div>
      <div id="exitList"><div class="muted">در حال دریافت...</div></div>
    </section>

    <section class="card builder">
      <h3>ساخت تونل</h3>

      <div class="form-grid">
        <label>IP سرور خارج<input id="host" placeholder="168.222.49.180"></label>
        <label>پورت SSH<input id="sshPort" type="number" value="22"></label>
        <label>کاربر SSH<input id="sshUser" value="root"></label>
        <label>شناسه<input id="exitId" placeholder="exit01"></label>
        <label>پورت Tunnel<input id="tunnelPort" type="number" placeholder="خودکار"></label>
        <label>رمز SSH<input id="password" type="password" autocomplete="new-password"></label>
      </div>

      <label>Private Key<textarea id="privateKey" rows="3" placeholder="-----BEGIN OPENSSH PRIVATE KEY-----"></textarea></label>

      <div class="ports-title">
        <h4>پورت‌ها</h4>
        <div class="actions">
          <button class="btn small" type="button" onclick="standardPorts()">استاندارد</button>
          <button class="btn small primary" type="button" onclick="addPortRow()">+ پورت</button>
        </div>
      </div>

      <div class="port-head">
        <span>سرویس</span><span>نوع</span><span>پورت ایران</span><span>پورت خارج</span><span></span>
      </div>
      <div id="portRows"></div>

      <div class="row buttons">
        <button class="btn" onclick="preflight()">تست SSH</button>
        <button class="btn primary" onclick="addExit()">ساخت تونل</button>
      </div>
      <div id="job" class="job muted">آماده</div>
    </section>
  </main>
</div>
<script src="/static/app.js"></script>
</body>
</html>
