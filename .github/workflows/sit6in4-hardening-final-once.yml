name: SIT6in4 hardening final one-shot

on:
  push:
    branches:
      - feat/sit6in4-fast-bootstrap-v1

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install panel test dependencies
        run: |
          python3 -m pip install -q -r panel/requirements.txt
          python3 -m pip install -q pytest
      - name: Apply hardening
        run: python3 tools/sit_hardening_once.py
      - name: Validate source and contracts
        run: |
          python3 -m py_compile panel/provision_ipv6.py agent/tp27-exit-agent.py agent/tp27-exit-agent-plain.py tests/test_sit6in4_fast_bootstrap_contract.py
          bash -n bin/tp27-link-mtls
          python3 -m pytest -q tests/test_sit6in4_fast_bootstrap_contract.py tests/test_ipv6_fast_core_contract.py
          git diff --check
      - name: Commit and remove temporary files
        run: |
          git config user.name tp27-ci
          git config user.email 34453640+matin111@users.noreply.github.com
          git add panel/provision_ipv6.py agent/tp27-exit-agent-plain.py tests/test_sit6in4_fast_bootstrap_contract.py
          git rm -f .github/workflows/sit6in4-hardening-once.yml
          git rm -f .github/workflows/sit6in4-hardening-v2-once.yml
          git rm -f .github/workflows/sit6in4-hardening-final-once.yml
          git rm -f tools/sit_hardening_once.py
          git commit -m "fix: harden SIT capability probe and stale cleanup"
          git push origin HEAD:${GITHUB_REF_NAME}
