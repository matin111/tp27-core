name: Apply SIT6in4 v1b patch

on:
  push:
    branches:
      - feat/sit6in4-fast-bootstrap-v1
    paths:
      - tools/run_sit6in4_patch_v1b.py
      - .github/workflows/apply-sit6in4-v1b.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded transformation
        run: python3 tools/run_sit6in4_patch_v1b.py
      - name: Syntax checks before commit
        run: |
          python3 -m py_compile \
            panel/provision_ipv6.py \
            agent/tp27-exit-agent.py \
            agent/tp27-exit-agent-plain.py \
            tests/test_sit6in4_fast_bootstrap_contract.py
          bash -n bin/tp27-link-mtls
          git diff --check
      - name: Commit generated source changes
        run: |
          git config user.name 'tp27-ci'
          git config user.email '34453640+matin111@users.noreply.github.com'
          git add \
            panel/provision_ipv6.py \
            agent/tp27-exit-agent.py \
            agent/tp27-exit-agent-plain.py \
            bin/tp27-link-mtls \
            tests/test_sit6in4_fast_bootstrap_contract.py \
            docs/IPV6_FAST_CORE.md
          if git diff --cached --quiet; then
            echo 'NO_GENERATED_CHANGES=1'
            exit 0
          fi
          git commit -m 'feat: add SIT 6in4 bootstrap for IPv6 fast core'
          git push origin HEAD:${GITHUB_REF_NAME}
