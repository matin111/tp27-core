name: Apply managed panel readiness fix

on:
  push:
    branches: [fix/sit6in4-panel-import-smoke]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch installer and CI contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          installer = Path('install-panel-managed.sh')
          s = installer.read_text()

          old = '''sleep 2
systemctl is-active --quiet tp27-panel.service || { systemctl status tp27-panel.service --no-pager -l; exit 3; }
curl -kfsS --connect-timeout 2 --max-time 5 https://127.0.0.1:8787/login >/dev/null
'''
          new = '''# Validate the Python application before asking systemd to serve it. py_compile
# alone cannot catch import-time failures such as circular imports or missing names.
(
  cd "$PANEL"
  PYTHONPATH="$PANEL" "$PANEL/venv/bin/python" - <<'PYAPP'
import app
assert getattr(app, 'app', None) is not None
print('PRE_RESTART_APP_IMPORT=OK')
PYAPP
)

# systemd Type=simple reports active as soon as the process starts; Uvicorn may
# still be importing the app and may not have bound :8787 yet. Use a bounded
# readiness gate instead of treating a single early connection refusal as a
# broken release.
PANEL_READY=0
for attempt in $(seq 1 30); do
  if systemctl is-active --quiet tp27-panel.service && \
     curl -kfsS --connect-timeout 2 --max-time 4 https://127.0.0.1:8787/login >/dev/null 2>&1; then
    PANEL_READY=1
    echo "PANEL_READY=OK attempt=$attempt"
    break
  fi
  sleep 1
done

if [[ "$PANEL_READY" -ne 1 ]]; then
  echo "ERROR: tp27-panel did not become HTTPS-ready within 30s" >&2
  systemctl status tp27-panel.service --no-pager -l >&2 || true
  journalctl -u tp27-panel.service -n 120 --no-pager >&2 || true
  exit 3
fi
'''
          if s.count(old) != 1:
              raise SystemExit(f'installer readiness anchor count={s.count(old)}')
          installer.write_text(s.replace(old, new, 1))

          ci = Path('.github/workflows/ci.yml')
          c = ci.read_text()
          old_ci = "          grep -q 'INSTALL_SMOKE=OK' install-panel-managed.sh\n          grep -q 'DATA_PLANES=verified-untouched' install-panel-managed.sh\n"
          new_ci = "          grep -q 'INSTALL_SMOKE=OK' install-panel-managed.sh\n          grep -q 'PRE_RESTART_APP_IMPORT=OK' install-panel-managed.sh\n          grep -q 'PANEL_READY=OK' install-panel-managed.sh\n          grep -q 'journalctl -u tp27-panel.service' install-panel-managed.sh\n          grep -q 'DATA_PLANES=verified-untouched' install-panel-managed.sh\n"
          if c.count(old_ci) != 1:
              raise SystemExit(f'ci release-gate anchor count={c.count(old_ci)}')
          ci.write_text(c.replace(old_ci, new_ci, 1))
          PY

      - name: Validate generated change
        shell: bash
        run: |
          set -euo pipefail
          bash -n install-panel-managed.sh
          python -m compileall -q panel tests
          git diff --check
          grep -q 'PRE_RESTART_APP_IMPORT=OK' install-panel-managed.sh
          grep -q 'PANEL_READY=OK' install-panel-managed.sh
          grep -q 'journalctl -u tp27-panel.service' install-panel-managed.sh

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-panel-readiness-fix.yml
          git add install-panel-managed.sh .github/workflows/ci.yml
          git commit -m 'fix(updater): wait for panel readiness before rollback'
          git push origin HEAD:fix/sit6in4-panel-import-smoke
