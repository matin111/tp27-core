name: TP27 Production Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tp27-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: panel/requirements.txt

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r panel/requirements.txt pytest

      - name: Python syntax
        run: python -m compileall -q panel tests

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find panel/static -maxdepth 1 -type f -name '*.js' -print0 | sort -z)

      - name: Shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find . -type f -name '*.sh' -not -path './.git/*' -print0 | sort -z)
          for file in bin/tp27-link bin/tp27-link-dispatcher bin/tp27-link-preflight bin/tp27-openvpn-core; do
            if [ -f "$file" ] && head -1 "$file" | grep -qE '(^#!.*/(ba)?sh|^#!/usr/bin/env (ba)?sh)'; then
              bash -n "$file"
            fi
          done

      - name: Regression tests
        run: pytest -q

      - name: Release-gate contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q "or 'stable'" panel/self_update.py
          grep -q 'verify_panel_smoke()' bin/tp27-panel-self-update
          grep -q 'INSTALL_SMOKE=OK' install-panel-managed.sh
          grep -q 'DATA_PLANES=verified-untouched' install-panel-managed.sh
